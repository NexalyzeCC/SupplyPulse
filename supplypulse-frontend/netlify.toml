[build]
  base      = "supplypulse-frontend"
  command   = "npm run build"
  publish   = "supplypulse-frontend/.next"

[dev]
  command    = "npm run dev"
  port       = 8888
  targetPort = 3000
  framework  = "#custom"

[functions]
  directory    = "supplypulse-frontend/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[scheduled_functions]]
  function = "scheduled-scan"
  schedule = "0 6 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"