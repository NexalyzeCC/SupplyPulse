[build]
  command   = "npm run build"
  publish   = ".next"

[dev]
  command    = "npm run dev"
  framework  = "#custom"
  targetPort = 3000
  port       = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["stripe", "resend"]

[[scheduled_functions]]
  function = "scheduled-scan"
  schedule = "0 6 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
