[build]
  command   = "npm run build"
  publish   = ".next"

[dev]
  command   = "npm run dev"
  port      = 8888
  targetPort = 3000
  framework = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[scheduled_functions]]
  function = "scheduled-scan"
  schedule = "0 6 * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
