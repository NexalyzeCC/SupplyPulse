[build]
  base    = "supplypulse-frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NPM_FLAGS = "--include=dev"

[dev]
  command    = "npm --prefix supplypulse-frontend run dev"
  targetPort = 3000
  port       = 8888
  framework  = "#custom"
  autoLaunch = false

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[scheduled_functions]]
  function = "scheduled-scan"
  schedule = "0 6 * * *"

[[scheduled_functions]]
  function = "scan-worker-cron"
  schedule = "*/10 * * * *"

[[plugins]]
  package = "@netlify/plugin-nextjs"
